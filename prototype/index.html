<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0908">
<title>ARMY ANTS 見た目の試作</title>
<style>
  :root {
    --bg: #050304;
    --panel: rgba(10, 6, 8, 0.86);
    --line: #3a111b;
    --text: #e8dcd0;
    --dim: #8c7a72;
    --accent: #ff3a2a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  /* 縦長の遊ぶ範囲（PC の横長画面では真ん中に縦長で置く） */
  #wrap { position: fixed; inset: 0; display: flex; justify-content: center; }
  #stage { position: relative; height: 100%; width: 100%; max-width: calc(100vh * 0.62); }
  #play { position: absolute; inset: 0; }
  #play canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #top { position: absolute; left: 0; right: 0; top: 0; padding: max(10px, env(safe-area-inset-top)) 12px 0;
    pointer-events: none; text-shadow: 0 1px 2px #000; }
  #title { font-size: 11px; letter-spacing: 0.2em; color: var(--dim); }
  #info b { display: block; font-size: 17px; margin-top: 2px; }
  #info span { display: block; font-size: 12px; color: var(--dim); margin-top: 2px; }
  #fps { font-size: 10px; color: #6a5a54; margin-top: 4px; font-variant-numeric: tabular-nums; }
  #panel { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 8px max(10px, env(safe-area-inset-bottom));
    background: linear-gradient(to bottom, rgba(10,6,8,0), var(--panel) 18px); }
  .row { display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .lbl { width: 34px; flex: none; font-size: 11px; color: var(--dim); text-align: right; }
  .seg { display: flex; flex: 1; gap: 4px; }
  .seg button, .btn { flex: 1; min-width: 0; height: 36px; border: 1px solid var(--line); border-radius: 6px;
    background: #140a0d; color: var(--text); font: inherit; font-size: 13px; font-weight: 600; padding: 0 2px;
    touch-action: manipulation; }
  .seg button.on, .btn.on { background: #5a1420; border-color: var(--accent); color: #fff; box-shadow: 0 0 10px rgba(255,58,42,0.35); }
  .seg button:disabled { opacity: 0.35; }
  .btn { flex: none; width: 64px; }
  #loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--dim); font-size: 14px; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="play"></div>
  <div id="top">
    <div id="title">ARMY ANTS ・ 見た目の試作（フェーズ1）</div>
    <div id="info"></div>
    <div id="fps"></div>
  </div>
  <div id="panel">
    <div class="row"><span class="lbl">変異</span><div class="seg" id="types"></div></div>
    <div class="row"><span class="lbl">Lv</span><div class="seg" id="lvs"></div>
      <span class="lbl">匹数</span><div class="seg" id="counts" style="flex:1.6"></div></div>
    <div class="row"><span class="lbl">拡大</span><div class="seg" id="zooms"></div>
      <button class="btn" id="fire">攻撃</button><button class="btn" id="auto">自動</button></div>
  </div>
  <div id="loading">読み込み中…</div>
</div></div>
<script type="module" src="main.js"></script>
</body>
</html>
